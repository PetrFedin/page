name: Cloudflare contact fail-closed security
on:
  pull_request:
    paths:
      - 'functions/api/contact.js'
      - 'scripts/verify-main-contact-security.mjs'
      - '.github/workflows/contact-security.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contact-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: JavaScript syntax
        run: |
          node --check functions/api/contact.js
          node --check scripts/verify-main-contact-security.mjs
      - name: Mocked security and failure modes
        run: node scripts/verify-main-contact-security.mjs
