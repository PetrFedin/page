name: Import second verified tablet screenshots

on:
  push:
    branches: [syntha-v2-preview-product-refresh]
    paths:
      - '.github/workflows/import-second-real-tablet-shots.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FASHION_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8c20-8210-9dae-1f463d7bcf00/raw?se=2026-10-10T00%3A52%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=5c16e2eb-c269-5fc6-a076-1d51f9dae5b2&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T03%3A08%3A19Z&ske=2026-10-10T03%3A08%3A19Z&sks=b&skv=2026-02-06&sig=4xJcbK1PrzN89fQbYTWgQbZtj6w6fAl1wS9YO7dEw0Q%3D'
      FUR_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-95c0-8210-badd-193cad8cc6fc/raw?se=2026-10-10T00%3A52%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=a1f57dc7-5402-52bf-9129-14c65cd3257a&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T02%3A37%3A04Z&ske=2026-10-10T02%3A37%3A04Z&sks=b&skv=2026-02-06&sig=XXtonFjUfvy4nO0o8iFZTBjVPNlGujCNA5UjoUKhKww%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: syntha-v2-preview-product-refresh
      - name: Download and extract verified screenshots
        run: |
          mkdir -p /tmp/shots/fashion /tmp/shots/fur assets/shots
          curl -fsSL "$FASHION_URL" -o /tmp/shots/fashion.zip
          curl -fsSL "$FUR_URL" -o /tmp/shots/fur.zip
          unzip -q /tmp/shots/fashion.zip -d /tmp/shots/fashion
          unzip -q /tmp/shots/fur.zip -d /tmp/shots/fur
          cp /tmp/shots/fashion/fashion-management-orders-tablet.png assets/shots/fashion-management-orders-tablet.png
          cp /tmp/shots/fur/fur-production-stock-tablet.png assets/shots/fur-production-stock-tablet.png
          file assets/shots/fashion-management-orders-tablet.png assets/shots/fur-production-stock-tablet.png
      - name: Commit verified second screens
        run: |
          git config user.name "syntha-v2-qa"
          git config user.email "actions@users.noreply.github.com"
          git add assets/shots/fashion-management-orders-tablet.png assets/shots/fur-production-stock-tablet.png
          git commit -m "assets(v2): add second verified real tablet screens"
          git push origin HEAD:syntha-v2-preview-product-refresh
