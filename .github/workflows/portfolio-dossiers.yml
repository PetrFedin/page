name: Portfolio bilingual dossier integrity
on:
  pull_request:
    paths:
      - 'assets/app.js'
      - 'assets/content.js'
      - 'assets/logos.js'
      - 'assets/styles.css'
      - 'assets/portfolio-extensions.js'
      - 'assets/investor-calculator.js'
      - 'assets/lead-paths.js'
      - 'assets/news.js'
      - 'functions/api/contact.js'
      - 'functions/api/posts.js'
      - 'scripts/build-en.mjs'
      - 'scripts/make-feed.mjs'
      - 'scripts/verify-qualified-leads.mjs'
      - 'scripts/browser-lead-routes-qa.mjs'
      - 'scripts/verify-editorial-queue.mjs'
      - 'channel-queue.json'
      - 'package.json'
      - 'scripts/prepare-pages-release.mjs'
      - '.gitignore'
      - 'index.html'
      - 'en/index.html'
      - 'scripts/verify-investor-dossiers.mjs'
      - 'scripts/verify-investor-calculator.mjs'
      - 'scripts/browser-portfolio-qa.mjs'
      - '.github/workflows/portfolio-dossiers.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/investor-calculator.js
      - run: node --check assets/lead-paths.js
      - run: node --check assets/news.js
      - run: node --check functions/api/contact.js
      - run: node --check functions/api/posts.js
      - run: node --check assets/app.js
      - run: node --check assets/content.js
      - run: node --check assets/portfolio-extensions.js
      - run: node --check assets/logos.js
      - run: node scripts/verify-investor-dossiers.mjs
      - run: node scripts/verify-investor-calculator.mjs
      - run: node scripts/verify-qualified-leads.mjs
      - run: node scripts/verify-editorial-queue.mjs
      - run: npm run build
      - run: npm run package:pages
      - run: node scripts/verify-investor-dossiers.mjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Chromium RU and EN responsive acceptance
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist-pages >/tmp/portfolio-http.log 2>&1 &
          node scripts/browser-portfolio-qa.mjs
          node scripts/browser-lead-routes-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-portfolio-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
