<body>
<div class="app" id="app">
<header>
  <div class="header">
    <button class="mobile-menu" onclick="toggleMobileNav()">☰</button>
    <a class="brand" href="#" onclick="go('home');return false">Marco Pescarolo<small>Digital Showroom · Concept MVP</small></a>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <div class="chip role-chip" id="roleChip"></div>
      <div class="chip lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="it" onclick="setLang('it')">IT</button><button data-lang="ru" onclick="setLang('ru')">RU</button></div>
      <button class="chip saved-chip" id="savedChip" onclick="openSavedSelection()">Saved <strong id="savedCount">0</strong></button><button class="chip cart-chip" id="cartChip" onclick="openCart()">Bag <strong id="cartCount">0</strong></button>
    </div>
  </div>
</header>
<div id="mobileNav" class="hide" style="position:fixed;z-index:75;top:64px;left:10px;right:10px;background:#1f1d1a;color:#fff;border-radius:18px;padding:10px;box-shadow:var(--shadow)"></div>

<main>
<section class="page active" data-page="home">
  <div class="wrap hero">
    <div class="hero-copy">
      <div><div class="eyebrow" data-t="heroKicker"></div><h1 data-t="heroTitle"></h1></div>
      <div><p class="lead" data-t="heroLead"></p><div class="cta-row"><button class="btn" onclick="go('collection')" data-t="explore"></button><button class="btn secondary" onclick="setRole('buyer');go('quick')" data-t="buyerOrder"></button></div></div>
    </div>
    <div class="hero-art"><div class="art-label"><span>FW 26/27 · Official campaign imagery</span><b data-t="heroArt"></b></div></div>
  </div>
  <div class="wrap section">
    <div class="section-title"><h2 data-t="collectionStories"></h2><p data-t="storiesText"></p></div>
    <div class="editorial-grid">
      <article class="editorial-card" onclick="go('collection')"><div class="shape"></div><div class="content"><div class="eyebrow">FW 26/27</div><h3 data-t="currentCollection"></h3><p data-t="currentCollectionText"></p></div></article>
      <article class="editorial-card" onclick="go('collection');state.filters.category='Trousers';renderCollection()"><div class="shape"></div><div class="content"><div class="eyebrow">Signature</div><h3 data-t="trousers"></h3><p data-t="trousersText"></p></div></article>
      <article class="editorial-card" onclick="go('collection');state.filters.gender='LEI';renderCollection()"><div class="shape"></div><div class="content"><div class="eyebrow">Lei</div><h3 data-t="lei"></h3><p data-t="leiText"></p></div></article>
    </div>
    <div class="dna-head"><div><div class="eyebrow" data-t="brandDna"></div><h3 data-t="strengthMovement"></h3></div><p data-t="dnaIntro"></p></div>
    <div class="dna-grid">
      <div class="dna-card"><div class="num">01.</div><h3 data-t="elegance"></h3><p data-t="eleganceText"></p></div>
      <div class="dna-card"><div class="num">02.</div><h3 data-t="comfort"></h3><p data-t="comfortText"></p></div>
      <div class="dna-card"><div class="num">03.</div><h3 data-t="quality"></h3><p data-t="qualityText"></p></div>
    </div>
  </div>
  <div class="wrap section" style="padding-top:0">
    <div class="material-story">
      <div class="material-photo"></div>
      <div class="material-copy"><div><div class="eyebrow" style="color:#bdb3a8" data-t="materialEyebrow"></div><h2 data-t="materialTitle"></h2><p data-t="materialLead"></p></div>
        <div class="material-points">
          <div class="material-point"><strong>Natural Born Cashmere</strong><p data-t="cashmereText"></p></div>
          <div class="material-point"><strong>Vicuña Project</strong><p data-t="vicunaText"></p></div>
          <div class="material-point"><strong data-t="performanceTextures"></strong><p data-t="performanceText"></p></div>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap section" style="padding-top:0">
    <div class="heritage-strip"><div class="heritage-photo"></div><div class="heritage-copy"><div class="eyebrow">Napoli · Since 1999</div><h3 data-t="naplesHeritage"></h3><p data-t="naplesText"></p><div class="cta-row"><button class="btn secondary" onclick="go('collection')" data-t="explore"></button></div></div></div>
  </div>
  <div class="wrap section" style="padding-top:0">
    <div class="two-path">
      <div class="path-card dark"><div><div class="eyebrow" data-t="forBuyers"></div><h3 data-t="wholesaleDesk"></h3><p data-t="wholesaleText"></p></div><div><button class="btn" onclick="setRole('buyer');go('quick')" data-t="openQuick"></button></div></div>
      <div class="path-card"><div><div class="eyebrow" data-t="privateClient"></div><h3 data-t="privateConcierge"></h3><p data-t="privateText"></p></div><div><button class="btn secondary" onclick="setRole('private');go('private')" data-t="startRequest"></button></div></div>
    </div>
  </div>
</section>

<section class="page" data-page="collection"><div class="wrap">
  <div class="topbar"><div><div class="eyebrow" data-t="showroom"></div><h1 data-t="collection"></h1></div><p class="subtitle" data-t="collectionIntro"></p></div>
  <div class="filters" id="collectionFilters"></div><div class="products" id="products"></div><div style="height:80px"></div>
</div></section>

<section class="page" data-page="quick"><div class="wrap">
  <div class="topbar"><div><div class="eyebrow">B2B</div><h1 data-t="quickOrder"></h1></div><p class="subtitle" data-t="quickIntro"></p></div>
  <div class="filters" id="quickFilters"></div>
  <div class="quick-layout"><div class="order-list" id="quickList"></div><aside class="summary" id="orderSummary"></aside></div>
</div></section>

<section class="page" data-page="orders"><div class="wrap">
  <div class="topbar"><div><div class="eyebrow" data-t="clientService"></div><h1 data-t="orders"></h1></div><p class="subtitle" data-t="ordersIntro"></p></div>
  <div class="orders-grid"><div class="orders-list" id="ordersList"></div><div class="order-detail" id="orderDetail"></div></div>
</div></section>

<section class="page" data-page="portal"><div class="wrap">
  <div class="topbar"><div><div class="eyebrow" data-t="buyerAccount"></div><h1 data-t="portal"></h1></div><p class="subtitle" data-t="portalIntro"></p></div>
  <div class="portal-shell" id="buyerPortal"></div>
</div></section>

function accountB2B(p){const d=Math.max(0,Math.min(40,Number(state.buyerProfile?.discount||0)));return Math.round((p?.b2b||0)*(1-d/100))}
function inventoryFor(id){return state.inventory?.[id]||{ats:0,prebook:0,eta:'TBC'}}
function sellThroughFor(id){return Number(state.sellThrough?.[id]||0)}
function reorderScore(p){const st=sellThroughFor(p.id),inv=inventoryFor(p.id);return Math.max(0,Math.min(100,Math.round(st*.78+(inv.ats<10?18:inv.ats<20?10:2)+(isFav(p.id)?7:0))))}
function suggestedQty(p){const score=reorderScore(p);return score>=80?6:score>=68?4:score>=55?2:1}
function allocateWholesaleOrder(order){
  state.reservations=state.reservations||[];
  state.reservations=state.reservations.filter(r=>r.orderId!==order.id);
  for(const line of order.lines){
    const inv=inventoryFor(line.productId);
    let need=Number(line.qty)||0;
    const ats=Math.min(need,Math.max(0,Number(inv.ats)||0)); need-=ats;
    const prebook=Math.min(need,Math.max(0,Number(inv.prebook)||0)); need-=prebook;
    inv.ats=Math.max(0,(Number(inv.ats)||0)-ats);
    inv.prebook=Math.max(0,(Number(inv.prebook)||0)-prebook);
    state.reservations.push({id:'RSV-'+Date.now().toString().slice(-6)+'-'+Math.random().toString(36).slice(2,5),orderId:order.id,productId:line.productId,color:line.color,size:line.size,qty:line.qty,ats,prebook,shortfall:need,status:need>0?'partial':'reserved',at:new Date().toISOString()});
  }
}
function orderReservations(orderId){return(state.reservations||[]).filter(r=>r.orderId===orderId)}
function reservationTotals(orderId){return orderReservations(orderId).reduce((a,r)=>({ats:a.ats+r.ats,prebook:a.prebook+r.prebook,shortfall:a.shortfall+r.shortfall,total:a.total+r.qty}),{ats:0,prebook:0,shortfall:0,total:0})}
function replenishmentQueue(){return state.products.filter(p=>(state.assortment||[]).includes(p.id)).map(p=>({p,score:reorderScore(p),qty:suggestedQty(p),st:sellThroughFor(p.id),inv:inventoryFor(p.id)})).filter(x=>x.score>=58).sort((a,b)=>b.score-a.score)}

function importSellThrough(){
  const raw=document.getElementById('sellCsv')?.value||'';const rows=raw.trim().split(/\r?\n/).slice(1);let count=0;
  for(const row of rows){const [article,soldRaw,stockRaw]=row.split(',').map(x=>x.trim());const p=state.products.find(x=>x.article===article);if(!p)continue;const sold=Number(soldRaw)||0,stock=Number(stockRaw)||0;const denom=sold+stock;state.sellThrough[p.id]=denom?Math.round(sold/denom*100):0;if(state.inventory[p.id])state.inventory[p.id].ats=stock;count++}
  state.sellThroughImports.unshift({id:'ST-'+Date.now(),rows:count,at:new Date().toISOString(),buyer:state.buyerProfile?.name||'Buyer'});recordIntent('sellThroughImport','',count);save();closeOverlay();toast(t('imported'));renderPortal();if(state.page==='admin')renderAdmin()
}

function addModalProductToCart(id){const color=document.querySelector('#modalColors .active')?.dataset.val;const size=document.querySelector('#modalSizes .active')?.dataset.val;addCart(id,color,size);closeOverlay()}
function addCart(productId,color,size){const k=productId+'|'+color+'|'+size;const ex=state.cart.find(x=>x.key===k);if(ex)ex.qty++;else state.cart.push({key:k,productId,color,size,qty:1});save();renderHeader();toast(t('cartAdded'))}
function openCart(){const body=state.cart.length?state.cart.map(c=>{const p=state.products.find(x=>x.id===c.productId);return `<div class="cart-line"><div class="cart-thumb"></div><div><h4>${esc(p?.name||'')}</h4><p>${esc(c.color)} · ${esc(c.size)} · ${money(p?.b2c)}</p><div class="qty"><button onclick="cartQty('${esc(c.key)}',-1)">−</button><input value="${c.qty}" onchange="cartSet('${esc(c.key)}',this.value)"><button onclick="cartQty('${esc(c.key)}',1)">+</button></div></div><button class="x" style="width:28px;height:28px" onclick="removeCart('${esc(c.key)}')">×</button></div>`}).join(''):`<div class="empty"><h3>${t('emptyBag')}</h3></div>`;const total=cartTotal();drawer(`<div class="modal-head"><div><div class="eyebrow">B2C</div><h2>${t('bag')}</h2></div><button class="x" onclick="closeOverlay()">×</button></div>${body}${state.cart.length?`<div class="sep"></div><div style="display:flex;justify-content:space-between"><strong>${t('total')}</strong><strong>${money(total)}</strong></div><button class="btn" style="width:100%;margin-top:16px" onclick="openCheckout()">${t('checkout')}</button>`:''}`)}
function cartQty(k,d){const x=state.cart.find(x=>x.key===k);if(!x)return;x.qty=Math.max(0,x.qty+d);if(!x.qty)state.cart=state.cart.filter(y=>y.key!==k);save();renderHeader();openCart()}
function cartSet(k,v){const x=state.cart.find(x=>x.key===k);if(!x)return;x.qty=Math.max(0,parseInt(v)||0);if(!x.qty)state.cart=state.cart.filter(y=>y.key!==k);save();renderHeader();openCart()}
function removeCart(k){state.cart=state.cart.filter(x=>x.key!==k);save();renderHeader();openCart()}
function cartTotal(){return state.cart.reduce((a,c)=>{const p=state.products.find(x=>x.id===c.productId);return a+(p?.b2c||0)*c.qty},0)}
function openCheckout(){if(!state.cart.length)return;modal(`<div class="modal-head"><div><div class="eyebrow">B2C · Demo checkout</div><h2>${t('checkout')}</h2></div><button class="x" onclick="closeOverlay()">×</button></div><div class="form-grid"><div><div class="label">${t('checkoutName')}</div><div class="inputbox"><input id="coName" placeholder="Andrea Rossi"></div></div><div><div class="label">${t('checkoutContact')}</div><div class="inputbox"><input id="coContact" placeholder="email / phone"></div></div><div class="full"><div class="label">${t('checkoutAddress')}</div><div class="inputbox"><input id="coAddress" placeholder="Milano / Via …"></div></div><div class="full"><div class="micro">No real payment is processed in this Concept MVP. Production version can connect Stripe, Shopify or another payment provider.</div></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeOverlay()">${t('cancel')}</button><button class="btn" onclick="placeB2C()">${t('placeOrder')} · ${money(cartTotal())}</button></div>`)}
function placeB2C(){const name=document.getElementById('coName').value.trim(),contact=document.getElementById('coContact').value.trim(),addr=document.getElementById('coAddress').value.trim();if(!name||!contact){toast(t('required'),true);return}const o={id:orderId(),type:'b2c',client:name,contact,status:'submitted',manager:'Giulia',delivery:addr,notes:'Demo B2C order — payment not processed.',created:new Date().toISOString(),updated:new Date().toISOString(),unread:false,lines:state.cart.map(c=>{const p=state.products.find(x=>x.id===c.productId);return{productId:c.productId,color:c.color,size:c.size,qty:c.qty,unit:p?.b2c||0}}),messages:[],internal:[]};state.orders.unshift(o);state.cart=[];state.selectedOrder=o.id;save();renderHeader();closeOverlay();toast(t('orderSubmitted'));go('orders')}
function orderId(){return'MP-'+new Date().getFullYear().toString().slice(-2)+String(Math.floor(100000+Math.random()*899999))}
function draftQty(productId,color,size){return Number(state.draft[productId]?.[color]?.[size]||0)}
function setDraftQty(productId,color,size,v){state.draft[productId]??={};state.draft[productId][color]??={};state.draft[productId][color][size]=Math.max(0,Number(v)||0);save();updateSummaryOnly();renderQuickProductTotals(productId)}
function addDraft(productId,color,size,d){setDraftQty(productId,color,size,draftQty(productId,color,size)+d);const inp=document.querySelector(`[data-qkey="${CSS.escape(productId+'|'+color+'|'+size)}"]`);if(inp)inp.value=draftQty(productId,color,size)}
function quickLines(){const lines=[];for(const [pid,colors] of Object.entries(state.draft)){const p=state.products.find(x=>x.id===pid);if(!p)continue;for(const [color,sizes] of Object.entries(colors))for(const [size,qty] of Object.entries(sizes))if(Number(qty)>0)lines.push({productId:pid,color,size,qty:Number(qty),unit:accountB2B(p)})}return lines}
function quickTotals(){const lines=quickLines();return{units:lines.reduce((a,b)=>a+b.qty,0),value:lines.reduce((a,b)=>a+b.qty*b.unit,0)}}
function sizeRunPattern(n,mode){const full=Array(n).fill(1);if(mode==='full')return full.map((x,i)=>i>0&&i<n-1?2:1);const center=(n-1)/2;return full.map((x,i)=>Math.abs(i-center)<=.7?2:Math.abs(i-center)<=1.7?1:0)}
function applySizeRun(pid,color,mode){const p=state.products.find(x=>x.id===pid);if(!p)return;state.draft[pid]??={};state.draft[pid][color]??={};const vals=mode==='clear'?Array(p.sizes.length).fill(0):sizeRunPattern(p.sizes.length,mode);p.sizes.forEach((sz,i)=>state.draft[pid][color][sz]=vals[i]);recordIntent('sizeRun',pid);save();document.getElementById('qgrid-'+pid).innerHTML=quickGrid(p,color);renderQuickProductTotals(pid);renderSummary()}
function orderReadiness(){const lines=quickLines(),styles=new Set(lines.map(x=>x.productId)).size;let score=0;if(lines.length)score+=35;if((state.draftMeta.client||'').trim())score+=20;if((state.draftMeta.delivery||'').trim())score+=20;if((state.draftMeta.notes||'').trim())score+=10;if(styles>=3)score+=15;return{score:Math.min(100,score),styles}}
function applySuggestedReorder(){const prev=state.orders.find(o=>o.type==='wholesale'&&['confirmed','inProduction','shipped','completed','submitted','inReview'].includes(o.status));if(!prev){toast(t('noOrders'),true);return}state.draft={};for(const l of prev.lines){const boost=isFav(l.productId)?1:0;state.draft[l.productId]??={};state.draft[l.productId][l.color]??={};state.draft[l.productId][l.color][l.size]=Math.max(1,l.qty+boost)}for(const pid of(state.favorites||[])){const p=state.products.find(x=>x.id===pid);if(!p)continue;const c=p.colors[0]?.[0],mid=p.sizes[Math.floor(p.sizes.length/2)];state.draft[pid]??={};state.draft[pid][c]??={};if(!state.draft[pid][c][mid])state.draft[pid][c][mid]=1}state.draftMeta={delivery:'',notes:'Suggested reorder from '+prev.id+' · demo heuristic',client:state.buyerProfile?.name||prev.client};delete state.draftOrderId;state.quickSavedOnly=false;state.quickAssortmentOnly=false;recordIntent('smartReorder','',quickTotals().value);save();renderQuick();toast(t('reorderApplied'))}
function renderQuick(){const cats=['All',...new Set(state.products.map(p=>p.category))],genders=['All','MAN','LEI'],cols=['All',...new Set(state.collections.map(c=>c.name))];const f=state.quickFilters;document.getElementById('quickFilters').innerHTML=`<div class="field search"><input value="${esc(f.search)}" oninput="state.quickFilters.search=this.value;renderQuick()" placeholder="${t('search')}"></div>${selectHtml('gender',genders,f.gender,'quickFilters')}${selectHtml('category',cats,f.category,'quickFilters')}${selectHtml('collection',cols,f.collection,'quickFilters')}<button class="btn ghost small saved-filter ${state.quickSavedOnly?'active':''}" onclick="state.quickSavedOnly=!state.quickSavedOnly;state.quickAssortmentOnly=false;renderQuick()">♥ ${t('savedOnly')}</button><button class="btn ghost small saved-filter ${state.quickAssortmentOnly?'active':''}" onclick="state.quickAssortmentOnly=!state.quickAssortmentOnly;state.quickSavedOnly=false;renderQuick()">${t('myAssortment')}</button><button class="btn ghost small" onclick="applySuggestedReorder()">${t('smartReorder')}</button><button class="btn ghost small" onclick="repeatPrevious()">${t('repeatOrder')}</button>`;let ps=state.products.filter(p=>p.active!==false).filter(p=>(!f.search||(p.name+' '+p.article).toLowerCase().includes(f.search.toLowerCase()))&&(f.gender==='All'||p.gender===f.gender)&&(f.category==='All'||p.category===f.category)&&(f.collection==='All'||p.collection===f.collection)&&(!state.quickSavedOnly||isFav(p.id))&&(!state.quickAssortmentOnly||(state.assortment||[]).includes(p.id)));document.getElementById('quickList').innerHTML=ps.map(quickProduct).join('')||`<div class="empty"><h3>${t('noProducts')}</h3></div>`;renderSummary()}
function quickProduct(p){const color=p.colors[0]?.[0];const maxSizes=p.sizes.length;return `<div class="order-product" data-pid="${p.id}"><div class="op-head"><div class="thumb" style="${p.image?`background-image:url('${p.image}');background-size:cover;background-position:center`:''}"></div><div class="op-title"><div class="micro">${esc(p.article)} · ${p.gender} · ${esc(p.category)}</div><h3>${esc(p.name)}</h3><small><span class="account-price">${money(accountB2B(p))}</span> <span class="base-price">${money(p.b2b)}</span> · ${esc(p.fabric)}</small><span class="stock-inline">${t('ats')} ${inventoryFor(p.id).ats} · ${t('prebook')} ${inventoryFor(p.id).prebook} · ${esc(inventoryFor(p.id).eta)} · ${t('sellThroughLabel')} ${sellThroughFor(p.id)}%</span></div><span class="availability ${p.availability}">${t(p.availability==='mto'?'madeToOrder':p.availability)}</span></div><div class="color-tabs" id="ct-${p.id}">${p.colors.map((c,i)=>`<button class="color-tab ${i===0?'active':''}" data-color="${esc(c[0])}" onclick="switchQuickColor('${p.id}','${esc(c[0])}',this)"><span class="swatch" style="display:inline-block;vertical-align:middle;background:${c[1]}"></span> ${esc(c[0])}</button>`).join('')}</div><div id="qgrid-${p.id}" style="--size-count:${maxSizes}">${quickGrid(p,color)}</div><div class="run-tools"><button onclick="applySizeRun('${p.id}',document.querySelector('#ct-${p.id} .color-tab.active')?.dataset.color||'${esc(color)}','core')">${t('coreRun')}</button><button onclick="applySizeRun('${p.id}',document.querySelector('#ct-${p.id} .color-tab.active')?.dataset.color||'${esc(color)}','full')">${t('fullRun')}</button><button onclick="applySizeRun('${p.id}',document.querySelector('#ct-${p.id} .color-tab.active')?.dataset.color||'${esc(color)}','clear')">${t('clearRun')}</button></div><div class="op-foot"><span>${t('leadTime')}: ${esc(p.lead)}</span><strong id="ptotal-${p.id}">${productDraftTotalLabel(p.id)}</strong></div></div>`}
function quickGrid(p,color){return `<div class="size-grid" style="--size-count:${p.sizes.length}"><div class="size-cell label">${t('sizes')}</div>${p.sizes.map(s=>`<div class="size-cell header-size">${esc(s)}</div>`).join('')}<div class="size-cell label">${esc(color)}</div>${p.sizes.map(s=>{const q=draftQty(p.id,color,s);const key=p.id+'|'+color+'|'+s;return`<div class="size-cell qty-cell" data-size="${esc(s)}"><div class="qty"><button onclick="addDraft('${p.id}','${esc(color)}','${esc(s)}',-1)">−</button><input data-qkey="${esc(key)}" inputmode="numeric" value="${q}" onchange="setDraftQty('${p.id}','${esc(color)}','${esc(s)}',this.value)"><button onclick="addDraft('${p.id}','${esc(color)}','${esc(s)}',1)">+</button></div></div>`}).join('')}</div>`}
function switchQuickColor(pid,color,btn){document.querySelectorAll('#ct-'+pid+' .color-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const p=state.products.find(x=>x.id===pid);document.getElementById('qgrid-'+pid).innerHTML=quickGrid(p,color)}
function productDraftTotalLabel(pid){const p=state.products.find(x=>x.id===pid);let u=0;for(const l of quickLines())if(l.productId===pid)u+=l.qty;return`${u} ${t('units')} · ${money(u*accountB2B(p||{}))}`}
function renderQuickProductTotals(pid){const el=document.getElementById('ptotal-'+pid);if(el)el.textContent=productDraftTotalLabel(pid)}
function renderSummary(){const s=document.getElementById('orderSummary');if(!s)return;const x=quickTotals();s.innerHTML=`<div class="eyebrow" style="color:#bdb3a8">${t('orderSummary')}</div><h3>${state.draftOrderId||'New Wholesale'}</h3><div class="sum-row"><span>${t('units')}</span><strong>${x.units}</strong></div><div class="sum-row total"><span>${t('total')}</span><strong>${money(x.value)}</strong></div><div class="readiness">${(()=>{const r=orderReadiness();return `<div class="readiness-top"><span>${t('orderReadiness')}</span><strong>${r.score}%</strong></div><div class="readiness-track"><div class="readiness-fill" style="width:${r.score}%"></div></div><p>${r.score>=90?t('readyToSubmit'):t('completeOrder')}</p>`})()}</div><div class="buyer-profile"><span>${t('buyerProfile')} · ${t('demoSignals')}</span><strong>${esc(state.buyerProfile?.name||state.draftMeta.client||'Buyer')}</strong><span>${esc(state.buyerProfile?.market||'')} · ${esc(state.buyerProfile?.priceList||'')} · ${esc(state.buyerProfile?.terms||'')}</span><div style="margin-top:8px"><button class="link" onclick="openBuyerProfile()">${t('editProfile')}</button></div></div><div class="field"><input id="draftClient" value="${esc(state.draftMeta.client||'')}" placeholder="${t('storeName')}" oninput="state.draftMeta.client=this.value;save()"></div><div class="field"><input id="draftDelivery" value="${esc(state.draftMeta.delivery||'')}" placeholder="${t('delivery')}" oninput="state.draftMeta.delivery=this.value;save()"></div><div class="field"><textarea id="draftNotes" placeholder="${t('notes')}" oninput="state.draftMeta.notes=this.value;save()">${esc(state.draftMeta.notes||'')}</textarea></div><button class="btn secondary" onclick="saveDraftOrder()">${t('saveDraft')}</button><button class="btn" onclick="submitWholesale()">${t('submitOrder')}</button><div class="micro" style="margin-top:11px;color:#bdb3a8">Concept MVP · quantities and prices are demo data.</div>`;const m=document.getElementById('mobileSummary');m.classList.toggle('hide',state.page!=='quick');m.innerHTML=`<div><span class="micro" style="color:#bbb">${t('units')}</span><strong>${x.units} · ${money(x.value)}</strong></div><button onclick="openMobileSummary()">${t('orderSummary')}</button>`}
function updateSummaryOnly(){renderSummary()}
function openMobileSummary(){modal(document.getElementById('orderSummary').innerHTML)}
function setQuickProduct(pid){const p=state.products.find(x=>x.id===pid);if(!p)return;recordIntent('quick',pid);state.quickSavedOnly=false;state.quickAssortmentOnly=false;state.quickFilters.search=p.article;renderQuick();setTimeout(()=>document.querySelector(`[data-pid="${pid}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),50)}
function saveDraftOrder(){const lines=quickLines();if(!lines.length){toast(t('emptyOrder'),true);return}let existing=state.draftOrderId&&state.orders.find(x=>x.id===state.draftOrderId);const o=existing||{id:orderId(),type:'wholesale',created:new Date().toISOString(),messages:[],internal:[],manager:'',unread:false};Object.assign(o,{client:state.draftMeta.client||'Demo Buyer Store',contact:'buyer@demo.store',status:'draft',delivery:state.draftMeta.delivery||'',notes:state.draftMeta.notes||'',updated:new Date().toISOString(),lines});if(!existing)state.orders.unshift(o);state.draftOrderId=o.id;state.selectedOrder=o.id;recordIntent('draft','',orderValue(o));save();toast(t('draftSaved'));renderSummary()}
function submitWholesale(){const lines=quickLines();if(!lines.length){toast(t('emptyOrder'),true);return}const o={id:state.draftOrderId||orderId(),type:'wholesale',client:state.draftMeta.client||'Demo Buyer Store',contact:'buyer@demo.store',status:'submitted',manager:'Alessandro',delivery:state.draftMeta.delivery||'',notes:state.draftMeta.notes||'',created:new Date().toISOString(),updated:new Date().toISOString(),unread:false,lines,messages:[{from:'client',text:'Wholesale order submitted from Digital Showroom.',at:new Date().toISOString()}],internal:[]};const idx=state.orders.findIndex(x=>x.id===o.id);if(idx>=0)state.orders[idx]=o;else state.orders.unshift(o);if(!state.invoices.some(x=>x.orderId===o.id)){const due=new Date(Date.now()+14*86400000).toISOString().slice(0,10);state.invoices.unshift({id:'INV-'+o.id.replace('MP-',''),orderId:o.id,amount:Math.round(orderValue(o)*0.3),due,status:'due'})}allocateWholesaleOrder(o);state.selectedOrder=o.id;recordIntent('submit','',orderValue(o));state.draft={};state.draftMeta={delivery:'',notes:'',client:state.buyerProfile?.name||'Concept Store Milano'};delete state.draftOrderId;save();toast(t('orderSubmitted'));go('orders')}
function repeatPrevious(){const prev=state.orders.find(o=>o.type==='wholesale'&&o.status!=='draft');if(!prev){toast(t('noOrders'),true);return}state.draft={};for(const l of prev.lines){state.draft[l.productId]??={};state.draft[l.productId][l.color]??={};state.draft[l.productId][l.color][l.size]=l.qty}state.draftMeta={delivery:'',notes:'Repeated from '+prev.id,client:prev.client};delete state.draftOrderId;save();renderQuick();toast(t('repeatOrder'))}
function orderValue(o){return o.lines.reduce((a,l)=>a+l.qty*l.unit,0)}function orderUnits(o){return o.lines.reduce((a,l)=>a+l.qty,0)}
function statusKey(s){return{draft:'draft',submitted:'submitted',inReview:'inReview',confirmed:'confirmed',inProduction:'inProduction',shipped:'shipped',completed:'completed',cancelled:'cancelled'}[s]||s}
function renderOrders(){if(!state.selectedOrder&&state.orders.length)state.selectedOrder=state.orders[0].id;document.getElementById('ordersList').innerHTML=state.orders.length?state.orders.map(o=>`<div class="order-item ${state.selectedOrder===o.id?'active':''}" onclick="state.selectedOrder='${o.id}';oMarkRead('${o.id}');renderOrders()"><div class="order-item-top"><div class="order-id">${esc(o.id)}${o.unread?'<span class="unread"></span>':''}</div><span class="status">${t(statusKey(o.status))}</span></div><p>${esc(o.client)} · ${t(o.type==='wholesale'?'wholesaleType':o.type==='private'?'privateType':'b2cType')} · ${orderUnits(o)} ${t('units')} · ${money(orderValue(o))}</p></div>`).join(''):`<div class="empty"><h3>${t('noOrders')}</h3></div>`;const o=state.orders.find(x=>x.id===state.selectedOrder);document.getElementById('orderDetail').innerHTML=o?orderDetailHtml(o):`<div class="empty"><h3>${t('noOrders')}</h3></div>`}
function oMarkRead(id){const o=state.orders.find(x=>x.id===id);if(o){o.unread=false;save()}}
function orderDetailHtml(o){const productLines=o.lines.map(l=>{const p=state.products.find(x=>x.id===l.productId);return`<div class="line-row"><div><strong>${esc(p?.name||l.productId)}</strong><div class="micro">${esc(p?.article||'')} · ${esc(l.color)} · ${esc(l.size)}</div></div><div>${l.qty} × ${money(l.unit)}</div><strong>${money(l.qty*l.unit)}</strong></div>`}).join('');const msgs=[...o.messages.map(m=>({...m,kind:'msg'})),...o.internal.map(m=>({...m,kind:'internal'}))].sort((a,b)=>new Date(a.at)-new Date(b.at));return`<div class="detail-head"><div><div class="eyebrow">${t('orderNo')}</div><h2>${esc(o.id)}</h2><div class="micro">${esc(o.client)} · ${t(o.type==='wholesale'?'wholesaleType':o.type==='private'?'privateType':'b2cType')}</div></div>${state.role==='brand'?statusSelect(o):`<span class="status">${t(statusKey(o.status))}</span>`}</div><div class="detail-stats"><div class="stat"><span>${t('units')}</span><strong>${orderUnits(o)}</strong></div><div class="stat"><span>${t('total')}</span><strong>${money(orderValue(o))}</strong></div><div class="stat"><span>${t('manager')}</span><strong>${esc(o.manager||'—')}</strong></div><div class="stat"><span>${t('delivery')}</span><strong style="font-size:14px">${esc(o.delivery||'—')}</strong></div></div>${state.role==='brand'?`<div class="filters"><div class="field"><input value="${esc(o.manager||'')}" placeholder="${t('assignManager')}" onchange="setManager('${o.id}',this.value)"></div></div>`:''}<div class="line-items"><div class="eyebrow">${t('orderLines')}</div>${productLines}</div><div class="eyebrow" style="margin-bottom:8px">${t('messages')}</div><div class="thread">${msgs.length?msgs.map(m=>`<div class="message ${m.kind==='internal'?'internal':(m.from===state.role||m.from==='brand'&&state.role==='brand'||m.from==='client'&&state.role!=='brand')?'mine':''}">${esc(m.text)}<small>${m.kind==='internal'?t('internal'):(m.from==='brand'?t('brand'):t('client'))} · ${fmtDate(m.at)}</small></div>`).join(''):`<div class="micro">No messages yet.</div>`}<div class="compose"><input id="msgInput" placeholder="${t('typeMessage')}" onkeydown="if(event.key==='Enter')sendMessage('${o.id}')"><button onclick="sendMessage('${o.id}')">${t('send')}</button></div>${state.role==='brand'?`<div class="internal-note"><input id="noteInput" placeholder="${t('typeInternal')}" onkeydown="if(event.key==='Enter')addInternal('${o.id}')"><button onclick="addInternal('${o.id}')">${t('addNote')}</button></div>`:''}</div><div class="sep"></div><div class="micro">${t('created')}: ${fmtDate(o.created)} · ${t('updated')}: ${fmtDate(o.updated)}</div>`}
function statusSelect(o){const vals=['draft','submitted','inReview','confirmed','inProduction','shipped','completed','cancelled'];return`<select class="field" onchange="setStatus('${o.id}',this.value)">${vals.map(x=>`<option value="${x}" ${x===o.status?'selected':''}>${t(x)}</option>`).join('')}</select>`}
function setStatus(id,s){const o=state.orders.find(x=>x.id===id);if(!o)return;o.status=s;o.updated=new Date().toISOString();o.messages.push({from:'brand',text:'Status updated: '+t(s),at:o.updated});o.unread=true;save();renderOrders()}
function setManager(id,v){const o=state.orders.find(x=>x.id===id);if(!o)return;o.manager=v;o.updated=new Date().toISOString();save();renderOrders()}
function sendMessage(id){const inp=document.getElementById('msgInput'),v=inp?.value.trim();if(!v)return;const o=state.orders.find(x=>x.id===id);o.messages.push({from:state.role==='brand'?'brand':'client',text:v,at:new Date().toISOString()});o.updated=new Date().toISOString();o.unread=state.role==='brand';save();renderOrders()}
function addInternal(id){const inp=document.getElementById('noteInput'),v=inp?.value.trim();if(!v)return;const o=state.orders.find(x=>x.id===id);o.internal.push({text:v,at:new Date().toISOString()});o.updated=new Date().toISOString();save();renderOrders()}
function portalAssortRow(p){
  const inv=inventoryFor(p.id),score=reorderScore(p);

function preparePortalReorder(pid){
  const p=state.products.find(x=>x.id===pid);if(!p)return;
  const color=p.colors[0]?.[0],mid=p.sizes[Math.floor(p.sizes.length/2)];
  state.draft[pid]??={};state.draft[pid][color]??={};state.draft[pid][color][mid]=Math.max(state.draft[pid][color][mid]||0,suggestedQty(p));
  state.quickFilters.search=p.article;state.quickSavedOnly=false;state.quickAssortmentOnly=false;recordIntent('sellThroughReorder',pid);save();go('quick')
}
function payInvoice(id){const inv=state.invoices.find(x=>x.id===id);if(!inv||inv.status==='paid')return;inv.status='paid';inv.paidAt=new Date().toISOString();save();toast(t('paymentDone'));renderPortal()}

function duplicateProduct(id){openProductForm(id,true)}
function saveProductForm(){const id=document.getElementById('pfId').value||'p'+Date.now();const name=document.getElementById('pfName').value.trim(),article=document.getElementById('pfArticle').value.trim();if(!name||!article){toast(t('required'),true);return}const colors=document.getElementById('pfColors').value.split(',').map(x=>x.trim()).filter(Boolean).map((x,i)=>{const a=x.split(':');return[a[0].trim(),(a[1]||['#9d8e7c','#39332e','#6d2531'][i%3]).trim()]});const sizes=document.getElementById('pfSizes').value.split(',').map(x=>x.trim()).filter(Boolean);const p={id,name,article,gender:document.getElementById('pfGender').value,category:document.getElementById('pfCategory').value.trim()||'Trousers',collection:document.getElementById('pfCollection').value,description:document.getElementById('pfDesc').value.trim(),fabric:document.getElementById('pfFabric').value.trim(),colors:colors.length?colors:[['Stone','#b7aa98']],sizes:sizes.length?sizes:['48','50','52'],b2b:Number(document.getElementById('pfB2B').value)||0,b2c:Number(document.getElementById('pfB2C').value)||0,availability:document.getElementById('pfAvail').value,lead:document.getElementById('pfLead').value.trim(),tag:'new',active:document.getElementById('pfActive').value==='true'};const i=state.products.findIndex(x=>x.id===id);if(i>=0)state.products[i]=p;else state.products.push(p);save();closeOverlay();toast(t('productSaved'));renderAdmin()}
function openCollectionForm(id){let c=id?structuredClone(state.collections.find(x=>x.id===id)):null;if(!c)c={id:'',name:'',audience:'Both',story:'',dates:'',status:'Active'};modal(`<div class="modal-head"><div><div class="eyebrow">Brand Admin</div><h2>${id?t('edit'):t('newCollection')}</h2></div><button class="x" onclick="closeOverlay()">×</button></div><input type="hidden" id="cfId" value="${esc(c.id)}"><div class="form-grid"><div><div class="label">${t('collectionName')}</div><div class="inputbox"><input id="cfName" value="${esc(c.name)}"></div></div><div><div class="label">${t('audience')}</div><div class="inputbox"><select id="cfAudience"><option ${c.audience==='MAN'?'selected':''}>MAN</option><option ${c.audience==='LEI'?'selected':''}>LEI</option><option ${c.audience==='Both'?'selected':''}>Both</option></select></div></div><div class="full"><div class="label">${t('story')}</div><div class="inputbox"><textarea id="cfStory">${esc(c.story)}</textarea></div></div><div><div class="label">${t('dates')}</div><div class="inputbox"><input id="cfDates" value="${esc(c.dates)}"></div></div><div><div class="label">${t('status')}</div><div class="inputbox"><select id="cfStatus"><option ${c.status==='Active'?'selected':''}>Active</option><option ${c.status==='Archive'?'selected':''}>Archive</option></select></div></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeOverlay()">${t('cancel')}</button><button class="btn" onclick="saveCollectionForm()">${t('save')}</button></div>`)}
function saveCollectionForm(){const id=document.getElementById('cfId').value||'c'+Date.now(),name=document.getElementById('cfName').value.trim();if(!name){toast(t('required'),true);return}const c={id,name,audience:document.getElementById('cfAudience').value,story:document.getElementById('cfStory').value.trim(),dates:document.getElementById('cfDates').value.trim(),status:document.getElementById('cfStatus').value};const i=state.collections.findIndex(x=>x.id===id);if(i>=0)state.collections[i]=c;else state.collections.push(c);save();closeOverlay();toast(t('collectionSaved'));renderAdmin()}
function resetDemo(){if(!confirm('Reset all demo data?'))return;const lang=state.lang;state=defaultState();state.lang=lang;state.adminTab='sales';initCommercialState();save();renderAll();toast(t('demoRestored'));go('admin')}
function modal(html,extra=''){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeOverlay()"><div class="modal ${extra}">${html}</div></div>`}
function drawer(html){document.getElementById('overlay').innerHTML=`<div class="drawer-backdrop" onclick="if(event.target===this)closeOverlay()"><div class="drawer">${html}</div></div>`}
function closeOverlay(){document.getElementById('overlay').innerHTML=''}
function toggleTour(){state.tour=!state.tour;renderTour()}
function renderTour(){const m=document.getElementById('tourMenu');m.classList.toggle('hide',!state.tour);m.innerHTML=`<p>${t('tourTitle')}</p><button onclick="state.tour=false;go('collection');renderTour()">${t('tourBrowse')}</button><button onclick="state.tour=false;setRole('buyer');go('quick');renderTour()">${t('tourB2B')}</button><button onclick="state.tour=false;setRole('private');go('private');renderTour()">${t('tourPrivate')}</button><button onclick="state.tour=false;setRole('brand');go('admin');renderTour()">${t('tourAdmin')}</button>`}
function renderAll(){renderHeader();renderStaticText();renderCollection();renderQuick();renderOrders();renderPortal();renderPrivate();renderAdmin();renderTour();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));document.getElementById('mobileSummary').classList.toggle('hide',state.page!=='quick')}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});
renderAll();
</script>
</body>
</html>
